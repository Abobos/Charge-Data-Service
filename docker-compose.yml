version: '3'

services:
  mongodb:
    image: mongo
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
    ports:
      - '27017:27017'

  task:
    depends_on:
      - mongodb
    build:
      context: .
      dockerfile: apps/task-service/Dockerfile
    environment:
      database_url: mongodb://mongodb:27017/ChargeData
      open_map_api_url: ${open_map_api_url}
      open_map_api_key: ${open_map_api_key}
      timeout: ${timeout}
    ports:
      - '4000:4000'

  graphql:
    depends_on:
      - mongodb
      - task
    build:
      context: .
      dockerfile: apps/graphql-service/Dockerfile
    environment:
      database_url: mongodb://mongodb:27017/ChargeData
    ports:
      - '3000:3000'

volumes:
  mongodb: ~
